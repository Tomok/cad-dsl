# Cargo build configuration for CAD-DSL project
#
# This configuration uses the mold linker for memory-efficient builds while
# maintaining debug information for better developer experience.

[build]
# Limit to 1 concurrent build job (affects linking phase primarily)
#
# RATIONALE: Even with the memory-efficient mold linker, limiting concurrent jobs
# ensures build stability on CI runners with limited memory (~7GB RAM).
# - Test binaries with debug info are large and memory-intensive
# - mold is more efficient than lld, but serial linking adds extra safety
# - Prevents OOM issues on memory-constrained CI environments
#
# IMPACT:
# - Ensures build reliability on CI runners
# - Increases build time but guarantees successful builds
# - Applies to both `cargo build` and `cargo test` (test binary compilation)
# - May be relaxed in the future if mold proves stable with parallel builds
#
# FUTURE: Consider removing if:
# - GitHub Actions provides larger runners (16GB+ RAM)
# - mold proves stable with parallel builds and debug = 1
jobs = 1

# Disable incremental compilation
#
# RATIONALE: Incremental compilation adds memory overhead during linking
# - Incremental metadata increases linker memory pressure
# - Provides minimal benefit with serial linking (jobs = 1) anyway
# - Simplifies build process and reduces cache size
# - Even with mold linker, incremental builds add unnecessary complexity
incremental = false

[profile.dev]
# Use default debug info (level 2) with mold linker
#
# RATIONALE: With the memory-efficient mold linker, we can safely use Rust's
# default debug information level (debug = 2) without causing OOM crashes.
# - Test binaries are monolithic and include ALL tests + test framework
# - mold linker handles large binaries with full debug info efficiently
# - debug = 2 (default) provides complete debug symbols and line numbers
# - Best debugging experience for development and CI troubleshooting
#
# IMPACT:
# - Full debug symbols available in backtraces for all test failures
# - Larger binary size but acceptable with mold's efficiency
# - Tests run correctly with complete error diagnostics
# - Optimal developer experience both locally and in CI
#
# ALTERNATIVE: If mold causes OOM issues with full debug symbols, revert to
# debug = 1 (line numbers only) or debug = 0 (no debug info).
# debug is not set here, so Rust uses its default value of 2 for dev profile

# Reduce code generation units to minimize linker workload
#
# RATIONALE: Fewer codegen units = fewer object files = less linker work
# - Default is 16 units in dev mode, which creates many object files
# - Each object file adds to linker memory pressure
# - Reducing to 1 creates a single object file per crate
# - Works synergistically with mold linker for efficient builds
#
# IMPACT:
# - Reduces linker memory consumption (helpful even with efficient mold)
# - Slower initial compilation but faster linking with mold
# - Helps prevent OOM crashes on CI runners
# - Trade-off: Slower incremental builds (but we disabled incremental anyway)
codegen-units = 1

[target.x86_64-unknown-linux-gnu]
# Use mold linker for fast, memory-efficient linking (Linux x86_64 only)
#
# RATIONALE: The mold linker is significantly more memory-efficient than lld
# and allows us to re-enable debug information without OOM crashes.
# - mold uses less memory than lld, even with parallel linking enabled
# - This allows debug info (debug = 1) to be enabled for better debugging
# - Faster link times compared to lld with single-threaded mode
#
# IMPACT:
# - Prevents linker OOM crashes while maintaining debug capabilities
# - Faster builds compared to single-threaded lld
# - Better developer experience with debug symbols available
# - Works reliably on CI runners with ~7GB RAM
#
# REQUIREMENTS:
# - mold must be installed (provided via nix development environment on Linux)
# - mold is conditionally added to nativeBuildInputs in flake.nix (Linux only)
#
# PLATFORM NOTES:
# - This configuration only affects x86_64 Linux builds
# - macOS/Darwin and other platforms will use their default system linkers
# - mold is ELF-specific and not available on non-Linux platforms
rustflags = ["-C", "linker=clang", "-C", "link-arg=-fuse-ld=mold"]
